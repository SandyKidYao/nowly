name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version_code: ${{ steps.assets.outputs.version_code }}
      sha256: ${{ steps.assets.outputs.sha256 }}
      size: ${{ steps.assets.outputs.size }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Validate published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Use a tag such as v0.2.5 or v0.2.5-beta.1'; exit 1; }
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          jq -e '.isDraft == false' "$RUNNER_TEMP/release.json"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .isPrerelease "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"
          echo "NOWLY_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOWLY_KEYSTORE_BASE64 }}
          NOWLY_KEYSTORE_PASSWORD: ${{ secrets.NOWLY_KEYSTORE_PASSWORD }}
          NOWLY_KEY_ALIAS: ${{ secrets.NOWLY_KEY_ALIAS }}
          NOWLY_KEY_PASSWORD: ${{ secrets.NOWLY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 NOWLY_KEYSTORE_PASSWORD NOWLY_KEY_ALIAS NOWLY_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing signing secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nowly-release.jks"
          echo "NOWLY_KEYSTORE_PATH=$RUNNER_TEMP/nowly-release.jks" >> "$GITHUB_ENV"
      - name: Verify and build release
        env:
          NOWLY_KEYSTORE_PASSWORD: ${{ secrets.NOWLY_KEYSTORE_PASSWORD }}
          NOWLY_KEY_ALIAS: ${{ secrets.NOWLY_KEY_ALIAS }}
          NOWLY_KEY_PASSWORD: ${{ secrets.NOWLY_KEY_PASSWORD }}
        run: |
          python3 scripts/check-site.py
          node --check site/app.js
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify APK signature and publish assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          PUBLISHED_MANIFEST: https://sandykidyao.github.io/nowly/release.json
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/nowly.apk
          VERSION_CODE=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/nowly.apk | sed -n "s/^package:.* versionCode='\([0-9]*\)'.*/\1/p")
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Could not read versionCode from the APK'; exit 1; }
          # Installed copies are only offered a higher versionCode, and Android refuses to install a lower one.
          # The page currently deployed describes the latest stable release; a rebuild of that same tag is fine.
          PUBLISHED=$(curl -fsSL --max-time 20 "$PUBLISHED_MANIFEST" || echo '{}')
          PUBLISHED_TAG=$(jq -r '.tag // ""' <<<"$PUBLISHED" 2>/dev/null || echo '')
          PUBLISHED_CODE=$(jq -r '.versionCode // 0 | floor' <<<"$PUBLISHED" 2>/dev/null || echo 0)
          if [[ "$PRERELEASE" == false && "$PUBLISHED_TAG" != "$RELEASE_TAG" && "$VERSION_CODE" -le "$PUBLISHED_CODE" ]]; then
            echo "versionCode $VERSION_CODE is not above the published $PUBLISHED_CODE ($PUBLISHED_TAG). Increase versionCode in app/build.gradle.kts."
            exit 1
          fi
          (cd dist && sha256sum nowly.apk > nowly.apk.sha256)
          gh release upload "$RELEASE_TAG" dist/nowly.apk dist/nowly.apk.sha256 --clobber
          {
            echo "version_code=$VERSION_CODE"
            echo "sha256=$(cut -d ' ' -f 1 dist/nowly.apk.sha256)"
            echo "size=$(stat -c %s dist/nowly.apk)"
          } >> "$GITHUB_OUTPUT"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nowly-release.jks"

  pages:
    name: Publish product page
    needs: apk
    # Preview releases have APKs, but do not replace the stable product page.
    if: needs.apk.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apk.outputs.tag }}
          persist-credentials: false
      - name: Prepare product page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.apk.outputs.tag }}
          VERSION_CODE: ${{ needs.apk.outputs.version_code }}
          APK_SHA256: ${{ needs.apk.outputs.sha256 }}
          APK_SIZE: ${{ needs.apk.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-site.py
          # The page's download link and the app's update check both read this file.
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/write-release-manifest.py "$RUNNER_TEMP/release-notes.md"
          touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
